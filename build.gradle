plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "QuiltMC"
		url = "https://maven.quiltmc.org/repository/release/"
		content {
			includeGroup "org.quiltmc.parsers"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rallyguard" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	def guardVillagersJar = file(project.guardvillagers_jar)
	if (guardVillagersJar.exists()) {
		modImplementation files(guardVillagersJar)
	} else {
		modImplementation "maven.modrinth:59rkB3YY:${project.guardvillagers_version}"
	}

	def midnightLibJar = file(project.midnightlib_jar)
	if (midnightLibJar.exists()) {
		modImplementation files(midnightLibJar)
	} else {
		modImplementation "maven.modrinth:codAaoxh:${project.midnightlib_version}"
	}

	modRuntimeOnly "curse.maven:configured-457570:${project.configured_file_id}"
	modRuntimeOnly "maven.modrinth:mOgUt4GM:${project.modmenu_version}"
	modRuntimeOnly "maven.modrinth:1eAoo2KR:${project.yacl_version}"
	runtimeOnly "org.quiltmc.parsers:gson:${project.quilt_parsers_gson_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
