plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "QuiltMC"
		url = "https://maven.quiltmc.org/repository/release/"
		content {
			includeGroup "org.quiltmc.parsers"
		}
	}
	maven {
		name = "MidnightDust"
		url = "https://maven.midnightdust.eu/releases"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client2 {
			inherit client
			name "Minecraft Client 2"
			runDir "run/client2"
			programArg "--username"
			programArg "RallyGuardTester2"
		}
	}

	mods {
		"rallyguard" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "rallyguard-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
		clearRunDirectory = true
		username = "RallyGuardTest"
	}
}

tasks.named("runClientGameTest") {
	mustRunAfter tasks.named("build")
}

tasks.register("syncClient2Settings", Copy) {
	group = "fabric"
	description = "Copies the primary development client's options and mod configuration to client 2."
	from("run/options.txt")
	from("run/config") {
		into "config"
	}
	into("run/client2")
}

tasks.named("runClient2") {
	dependsOn tasks.named("syncClient2Settings")
}

tasks.register("automatedSmokeTest") {
	group = "verification"
	description = "Builds the mod and runs unit, server GameTest, and client GameTest suites."
	dependsOn tasks.named("build")
	dependsOn tasks.named("runClientGameTest")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	def guardVillagersJar = file(project.guardvillagers_jar)
	if (guardVillagersJar.exists()) {
		implementation files(guardVillagersJar)
	} else {
		implementation "curse.maven:guard-villagers-fabric-571503:${project.guardvillagers_file_id}"
	}

	implementation "eu.midnightdust:midnightlib:${project.midnightlib_version}"
	implementation "curse.maven:collective-342584:${project.collective_file_id}"
	implementation "curse.maven:villager-names-345854:${project.villager_names_file_id}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.maven_artifact_id
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
